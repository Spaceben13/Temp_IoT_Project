version: "3.8"
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"   # MQTT (uten autentisering - for demo)
      - "9001:9001"   # Websocket (optional)
    volumes:
      # Usikker/demo konfigurasjon (tillater anonyme tilkoblinger)
      - ./mosquitto.conf/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

