# Secure Mosquitto configuration - username/password only (no TLS).
# To use this file, change docker-compose to mount it as /mosquitto/config/mosquitto.conf

# Global password file (gjelder for alle listeners)
allow_anonymous false
password_file /mosquitto/config/password.txt

# MQTT listener
listener 1883

# WebSocket listener (krever også autentisering)
listener 9001
protocol websockets

# Basic logging
log_type all
