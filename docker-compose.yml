version: "3.8"
# Standard konfigurasjon - usikker versjon (uten autentisering)
# For sikker versjon, bruk: docker-compose -f docker-compose.secure.yml up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"   # MQTT (no TLS) - used for demo
      - "9001:9001"   # Websocket (optional)
    volumes:
      # Insecure/demo config (allows anonymous connects).
      - ./mosquitto.conf/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  # Optional: run a small web dashboard later as a service if you like
  # dashboard:
  #   build: ./dashboard
  #   depends_on:
  #     - mosquitto
